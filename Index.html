<!DOCTYPE html>
<html lang="es" data-theme="light" style="color-scheme: light;"><head><meta charset="utf-8">

<title>Enzo · Sensibilidades</title>
<style>
:root{--bg:#07070d;--card:#14141f;--tx:#f4f4f8;--mu:#a0a0b8;--ac:#ff5a00;--ac2:#ffb100;--pu:#7b2cff;--ok:#2ecc71;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1fa;--card:#fff;--tx:#15151c;--mu:#66667a}}
:root[data-theme="dark"]{--bg:#07070d;--card:#14141f;--tx:#f4f4f8;--mu:#a0a0b8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#ff5a0033,transparent 55%),radial-gradient(circle at 100% 30%,#7b2cff30,transparent 45%),var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif;padding:16px;min-height:100%}
.w{max-width:520px;margin:auto}
.hero{text-align:center;padding:22px 0 8px}
.hero .f{font-size:46px;filter:drop-shadow(0 0 14px #ff5a00)}
h1{margin:0;font-size:40px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--ac2),var(--ac),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin:4px 0 0;letter-spacing:2px;font-size:13px;text-transform:uppercase}
.timer{margin:16px auto;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid #ff5a0055;border-radius:99px;padding:8px 16px;width:max-content;box-shadow:0 0 22px #ff5a0030}
.live{width:9px;height:9px;background:var(--ok);border-radius:50%;animation:p 1.2s infinite;box-shadow:0 0 8px var(--ok)}
@keyframes p{50%{opacity:.25}}
.card{background:var(--card);border:1px solid #ffffff14;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 30px #0006}
.card h2{margin:0 0 10px;font-size:16px;letter-spacing:1px}
.it{margin:11px 0}.it .t{display:flex;justify-content:space-between;font-size:14px}
.v{font-weight:800;color:var(--ac2);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:9px;background:#8882;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .6s}
.tag{font-size:12px;color:var(--mu)}
.price{font-size:38px;font-weight:900;color:var(--ac2);text-align:center;margin:4px 0}
.yape{background:linear-gradient(135deg,#742284,#a93bc4);border-radius:14px;padding:14px;text-align:center;color:#fff;margin:10px 0}
.yape b{font-size:22px;letter-spacing:2px;display:block}
button,input,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #8885;background:var(--bg);color:var(--tx);width:100%;margin-top:8px}
button{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:800;letter-spacing:.5px}
button.g{background:linear-gradient(90deg,#1fa85a,#2ecc71)}
a.mail{color:var(--ac2);text-decoration:none;font-weight:700}
.ent{border-top:1px solid #8883;padding-top:10px;margin-top:12px}.ent:first-child{border:0;margin-top:0;padding:0}.nm{font-size:18px;font-weight:900;display:flex;justify-content:space-between;align-items:center}.ago{font-size:12px;color:var(--ok);font-weight:600}.del{width:auto;padding:6px 10px;margin:0;background:#c0392b}.sb{display:inline-block;margin:6px;padding:12px 22px;border-radius:99px;color:#fff!important;font-weight:800;text-decoration:none;font-size:15px}.tt{background:linear-gradient(90deg,#00f2ea,#111 50%,#ff0050)}.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}.wa{background:linear-gradient(90deg,#128c7e,#25d366)}.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{margin:0;padding:9px;background:var(--bg);color:var(--tx);border:1px solid #8885;font-size:14px}.tabs button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0}.lk{text-align:center;padding:18px 6px;color:var(--mu)}.foot{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 30px}
#ed{border:1px dashed var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
label{font-size:12px;color:var(--mu);display:block;margin-top:8px}
</style></head><body><div class="w">
